# 한국 시황 세션: 평일 07:00 KST (= 전일 22:00 UTC, 일~목) 기동
# ⚠️ GitHub cron 지연(실측 40~55분) 흡수 버퍼 — capture.py가 07:55까지 대기 후 07:55~08:25 녹화
name: kr-session

on:
  schedule:
    - cron: "12 22 * * 0-4"    # KST 월~금 07:12 기동 (지연 흡수 버퍼 55분, 정각 혼잡 회피)
  workflow_dispatch:
    inputs:
      vod_url:
        description: "라이브 대신 사용할 VOD URL (테스트/복구용, 비우면 라이브 캡처)"
        required: false
        default: ""
      trim_start:
        description: "구간 트리밍 시작 (MM:SS, vod_url과 함께만 사용, 사전검토용)"
        required: false
        default: ""
      trim_duration:
        description: "구간 트리밍 길이 (MM:SS, trim_start와 함께 사용)"
        required: false
        default: ""
      output_tag:
        description: "artifact 이름 구분용 태그 (예: full, trim) — 여러 실행 비교 시 유용"
        required: false
        default: ""
      notify:
        description: "true면 VOD 테스트에서도 텔레그램/카카오로 실제 전송 (기본 무발송)"
        required: false
        default: ""
      archive:
        description: "true면 VOD 실행 결과도 볼트(3tv-reports)에 저장 (기본 미저장 — 유실분 복구용)"
        required: false
        default: ""

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 130      # 방송시작 대기(최대 55분) + 녹화 30분 + 분석 여유
    steps:
      - uses: actions/checkout@v4

      # n8n이 workflow_dispatch로 이미 오늘 성공시켰으면 이 안전망 cron 실행은
      # 건너뛴다 — schedule과 n8n이 겹쳐 돌면 텔레그램 중복 발송·Gemini 할당량
      # 낭비가 생긴다(2026-08-27 실측: us 리포트 2회 중복 발송). workflow_dispatch
      # (수동/n8n)는 절대 건너뛰지 않는다 — VOD 복구·테스트 실행이 막히면 안 됨.
      - name: 안전망 cron 중복 실행 방지
        id: dedup
        if: github.event_name == 'schedule'
        run: |
          curl -sS -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/kr-session.yml/runs?status=success&per_page=10" \
            -o /tmp/runs.json
          ALREADY=$(python3 -c "
          import json, datetime
          data = json.load(open('/tmp/runs.json'))
          today = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9))).strftime('%Y-%m-%d')
          cur = $GITHUB_RUN_ID
          found = False
          for run in data.get('workflow_runs', []):
              if run['id'] == cur:
                  continue
              dt = datetime.datetime.fromisoformat(run['created_at'].replace('Z', '+00:00'))
              kst = dt.astimezone(datetime.timezone(datetime.timedelta(hours=9)))
              if kst.strftime('%Y-%m-%d') == today:
                  found = True
                  break
          print('true' if found else 'false')
          ")
          echo "already=$ALREADY" >> "$GITHUB_OUTPUT"
          if [ "$ALREADY" = "true" ]; then
            echo "::notice::오늘 이미 성공한 실행이 있어(n8n 등) 이 안전망 cron 실행은 건너뜁니다"
          fi

      - uses: actions/setup-python@v5
        if: steps.dedup.outputs.already != 'true'
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Deno (yt-dlp JS 챌린지 솔버용)
        if: steps.dedup.outputs.already != 'true'
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        if: steps.dedup.outputs.already != 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt

      - name: Run pipeline (kr)
        if: steps.dedup.outputs.already != 'true'
        env:
          PYTHONPATH: src
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          # pykrx 회원 로그인 — 미전달 시 익명 요청으로 떨어져 국내 종목 시세가 빈다
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          # 네이버 검색 API — 종목별 관련 기사 + 뉴스 브리핑 수집
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_PARENT_ID: ${{ secrets.NOTION_PARENT_ID }}
        run: |
          VOD="${{ github.event.inputs.vod_url }}"
          TRIM_START="${{ github.event.inputs.trim_start }}"
          TRIM_DURATION="${{ github.event.inputs.trim_duration }}"
          if [ -z "$VOD" ]; then
            python -m threetv.main --session kr
            exit $?
          fi
          # VOD 테스트: 기본은 무발송·미저장. 유실분 복구 시에만 notify/archive를 켠다
          FLAGS=""
          if [ "${{ github.event.inputs.notify }}" != "true" ]; then
            FLAGS="$FLAGS --skip-notify"
          fi
          if [ "${{ github.event.inputs.archive }}" != "true" ]; then
            FLAGS="$FLAGS --skip-archive"
          fi
          if [ -n "$TRIM_START" ]; then
            FLAGS="$FLAGS --trim-start $TRIM_START --trim-duration $TRIM_DURATION"
          fi
          python -m threetv.main --session kr --vod-url "$VOD" $FLAGS

      # 리포트 본문을 로그로 — 캡처 2줄 포맷·화면 원문 보존 등을 아티팩트 없이 바로 확인
      - name: Print report (debug)
        if: always()
        run: |
          for f in $(find output -name report.md 2>/dev/null); do
            echo "===== $f ====="
            head -c 6000 "$f"
            echo
          done

      - name: Upload analysis artifacts (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kr-session-${{ github.event.inputs.output_tag || 'run' }}-${{ github.run_id }}
          path: |
            output/**/vision_results.json
            output/**/transcript.txt
            output/**/report.json
            output/**/report.md
          if-no-files-found: ignore
          retention-days: 7
