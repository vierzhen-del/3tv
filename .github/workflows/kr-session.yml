# 한국 시황 세션: 평일 07:00 KST (= 전일 22:00 UTC, 일~목) 기동
# ⚠️ GitHub cron 지연(실측 40~55분) 흡수 버퍼 — capture.py가 07:55까지 대기 후 07:55~08:25 녹화
name: kr-session

on:
  schedule:
    - cron: "0 22 * * 0-4"    # KST 월~금 07:00 기동 (지연 흡수 버퍼 55분)
  workflow_dispatch:
    inputs:
      vod_url:
        description: "라이브 대신 사용할 VOD URL (테스트/복구용, 비우면 라이브 캡처)"
        required: false
        default: ""
      trim_start:
        description: "구간 트리밍 시작 (MM:SS, vod_url과 함께만 사용, 사전검토용)"
        required: false
        default: ""
      trim_duration:
        description: "구간 트리밍 길이 (MM:SS, trim_start와 함께 사용)"
        required: false
        default: ""
      output_tag:
        description: "artifact 이름 구분용 태그 (예: full, trim) — 여러 실행 비교 시 유용"
        required: false
        default: ""
      notify:
        description: "true면 VOD 테스트에서도 텔레그램/카카오로 실제 전송 (기본 무발송)"
        required: false
        default: ""

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 130      # 방송시작 대기(최대 55분) + 녹화 30분 + 분석 여유
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Deno (yt-dlp JS 챌린지 솔버용)
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt

      - name: Run pipeline (kr)
        env:
          PYTHONPATH: src
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          # pykrx 회원 로그인 — 미전달 시 익명 요청으로 떨어져 국내 종목 시세가 빈다
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          # 네이버 검색 API — 종목별 관련 기사 + 뉴스 브리핑 수집
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_PARENT_ID: ${{ secrets.NOTION_PARENT_ID }}
        run: |
          VOD="${{ github.event.inputs.vod_url }}"
          TRIM_START="${{ github.event.inputs.trim_start }}"
          TRIM_DURATION="${{ github.event.inputs.trim_duration }}"
          if [ -z "$VOD" ]; then
            python -m threetv.main --session kr
            exit $?
          fi
          # VOD 테스트: 기본은 무발송(--skip-notify), notify=true면 텔레그램/카카오 전송
          FLAGS="--skip-archive"
          if [ "${{ github.event.inputs.notify }}" != "true" ]; then
            FLAGS="$FLAGS --skip-notify"
          fi
          if [ -n "$TRIM_START" ]; then
            FLAGS="$FLAGS --trim-start $TRIM_START --trim-duration $TRIM_DURATION"
          fi
          python -m threetv.main --session kr --vod-url "$VOD" $FLAGS

      - name: Upload analysis artifacts (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kr-session-${{ github.event.inputs.output_tag || 'run' }}-${{ github.run_id }}
          path: |
            output/**/vision_results.json
            output/**/transcript.txt
            output/**/report.json
            output/**/report.md
          if-no-files-found: ignore
          retention-days: 7
