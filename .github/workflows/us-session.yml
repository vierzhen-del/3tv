# 미국 시황 세션: 평일 05:00 KST (= 전일 20:00 UTC, 일~목) 기동
# ⚠️ GitHub cron은 40~55분 지연이 흔해(실측 7/12~7/16) 여유를 두고 기동하고,
#    capture.py가 방송 시작 시각(05:55 KST)까지 대기한 뒤 05:55~06:40 녹화한다.
name: us-session

on:
  schedule:
    - cron: "0 20 * * 0-4"    # KST 월~금 05:00 기동 (지연 흡수 버퍼 55분)
  workflow_dispatch:
    inputs:
      vod_url:
        description: "라이브 대신 사용할 VOD URL (테스트/복구용, 비우면 라이브 캡처)"
        required: false
        default: ""
      trim_start:
        description: "구간 트리밍 시작 (MM:SS, vod_url과 함께만 사용, 사전검토용)"
        required: false
        default: ""
      trim_duration:
        description: "구간 트리밍 길이 (MM:SS, trim_start와 함께 사용)"
        required: false
        default: ""
      output_tag:
        description: "artifact 이름 구분용 태그 (예: full, trim) — 여러 실행 비교 시 유용"
        required: false
        default: ""
      notify:
        description: "VOD 테스트 결과를 텔레그램/카카오로 실제 전송 (기본: 전송 안 함)"
        type: boolean
        required: false
        default: false
      archive:
        description: "VOD 실행 결과를 볼트(3tv-reports)에 저장 (기본: 저장 안 함 — 유실분 복구용)"
        type: boolean
        required: false
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150      # 방송시작 대기(최대 55분) + 녹화 45분 + 분석 여유
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Deno (yt-dlp JS 챌린지 솔버용)
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt

      - name: Run pipeline (us)
        env:
          PYTHONPATH: src
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          # pykrx 회원 로그인 — 미전달 시 익명 요청으로 떨어져 국내 종목 시세가 빈다
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          # 네이버 검색 API — 종목별 관련 기사 + 뉴스 브리핑 수집
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_PARENT_ID: ${{ secrets.NOTION_PARENT_ID }}
        run: |
          VOD="${{ github.event.inputs.vod_url }}"
          TRIM_START="${{ github.event.inputs.trim_start }}"
          TRIM_DURATION="${{ github.event.inputs.trim_duration }}"
          if [ -z "$VOD" ]; then
            python -m threetv.main --session us
            exit $?
          fi
          # VOD 테스트: 기본은 무발송·미저장. 유실분 복구 시에만 notify/archive를 켠다
          FLAGS=""
          if [ "${{ github.event.inputs.notify }}" != "true" ]; then
            FLAGS="$FLAGS --skip-notify"
          fi
          if [ "${{ github.event.inputs.archive }}" != "true" ]; then
            FLAGS="$FLAGS --skip-archive"
          fi
          if [ -n "$TRIM_START" ]; then
            FLAGS="$FLAGS --trim-start $TRIM_START --trim-duration $TRIM_DURATION"
          fi
          python -m threetv.main --session us --vod-url "$VOD" $FLAGS

      # 리포트 본문을 로그로 — 캡처 2줄 포맷·화면 원문 보존 등을 아티팩트 없이 바로 확인
      - name: Print report (debug)
        if: always()
        run: |
          for f in $(find output -name report.md 2>/dev/null); do
            echo "===== $f ====="
            head -c 6000 "$f"
            echo
          done

      - name: Upload analysis artifacts (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-session-${{ github.event.inputs.output_tag || 'run' }}-${{ github.run_id }}
          path: |
            output/**/vision_results.json
            output/**/transcript.txt
            output/**/report.json
            output/**/report.md
          if-no-files-found: ignore
          retention-days: 7
