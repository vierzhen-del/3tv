# 야간 미장 라이브 슬롯 캡처: "오선의 미국 증시 라이브" 22:00~06:00 KST를
# 매시 정각 5분씩 8번 캡처한다 — GitHub Actions 단일 job이 최대 6시간이라
# 8시간 연속 녹화가 불가능해서 쪼갰다(night-digest.yml이 06시에 8슬롯을 종합).
#
# 8개 cron 전부 UTC 13~20시(=KST 22~05시) 월~금 — 이 offset(+9h)은 UTC 자정을
# 넘지 않으므로 8개 슬롯이 전부 같은 UTC 요일에 들어간다(main.py의
# night_session_date() 참고).
#
# ⚠️ 슬롯은 "지금이 몇 시인지"가 아니라 **어느 cron이 매칭됐는지**
# (`github.event.schedule`)로 결정한다(2026-08-01). "지금 몇 시"로 계산하던
# 예전 방식은 cron이 밀리면(무료 티어 최대 3h38m) 없는 슬롯을 만들어냈다 —
# 05:00 cron이 06:15에 시작되면 `slots_kst`에 없는 "06:00" 유령 슬롯이 돼
# main.py의 _slot_settings/night_session_date와 어긋났다(실전 8슬롯 3일 연속
# 실패의 원인 중 하나). cron 문자열은 8개뿐이라 매핑표로 고정한다.
#
# 2026-08-27: 분(minute)을 0→9로 밀었다 — 정각(top of hour)은 GitHub Actions
# 스케줄 큐가 가장 혼잡한 시간대라 실측상 몇 시간 지연되거나(night-slot 마지막
# 슬롯 2h54m 지연) 아예 드롭되는 사례(night-digest·noon-session 둘 다 그날
# 실행 기록 자체가 없었음)가 있었다. cron을 바꾸면 위 case 매핑표도 함께
# 바꿔야 한다 — 문자열이 정확히 일치해야 슬롯이 인식된다.
name: night-slot

on:
  schedule:
    - cron: "9 13 * * 1-5"    # KST 22:09 (정각 혼잡 회피)
    - cron: "9 14 * * 1-5"    # KST 23:09
    - cron: "9 15 * * 1-5"    # KST 00:09 (다음날)
    - cron: "9 16 * * 1-5"    # KST 01:09
    - cron: "9 17 * * 1-5"    # KST 02:09
    - cron: "9 18 * * 1-5"    # KST 03:09
    - cron: "9 19 * * 1-5"    # KST 04:09
    - cron: "9 20 * * 1-5"    # KST 05:09
  workflow_dispatch:
    inputs:
      slot:
        description: "테스트용 슬롯 시각 강제 지정 (HH:00, 비우면 현재 KST 정시로 자동 계산)"
        required: false
        default: ""
      vod_url:
        description: "라이브 대신 사용할 VOD URL (테스트/복구용)"
        required: false
        default: ""
      trim_start:
        description: "구간 트리밍 시작 (MM:SS, vod_url과 함께만 사용)"
        required: false
        default: ""
      trim_duration:
        description: "구간 트리밍 길이 (MM:SS, trim_start와 함께 사용)"
        required: false
        default: ""
      archive:
        description: "true면 VOD 테스트 결과도 볼트에 저장 (기본 미저장)"
        required: false
        default: ""

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20      # 5분 캡처 + 비전 분석(flash-lite) 여유
    steps:
      - uses: actions/checkout@v4

      # n8n이 workflow_dispatch로 이 슬롯을 이미 오늘 성공시켰으면 이 안전망
      # cron 실행은 건너뛴다 — schedule과 n8n이 겹쳐 돌면 중복 캡처가 생긴다
      # (2026-08-27 실측: us 리포트 2회 중복 발송, 같은 계열 문제). 슬롯별로
      # 하루 8번 정상 실행되므로 "오늘 성공 여부"가 아니라 "이 슬롯 시각
      # ±40분 안에 이미 성공한 실행이 있는지"로 판단한다. workflow_dispatch
      # (수동/n8n)는 절대 건너뛰지 않는다 — 복구·테스트 실행이 막히면 안 됨.
      - name: 안전망 cron 중복 실행 방지
        id: dedup
        if: github.event_name == 'schedule'
        run: |
          case "${{ github.event.schedule }}" in
            "9 13 * * 1-5") HH="22" ;;
            "9 14 * * 1-5") HH="23" ;;
            "9 15 * * 1-5") HH="00" ;;
            "9 16 * * 1-5") HH="01" ;;
            "9 17 * * 1-5") HH="02" ;;
            "9 18 * * 1-5") HH="03" ;;
            "9 19 * * 1-5") HH="04" ;;
            "9 20 * * 1-5") HH="05" ;;
            *) HH="" ;;
          esac
          curl -sS -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/night-slot.yml/runs?status=success&per_page=30" \
            -o /tmp/runs.json
          ALREADY=$(python3 -c "
          import json, datetime
          data = json.load(open('/tmp/runs.json'))
          hh = '$HH'
          cur = $GITHUB_RUN_ID
          found = False
          if hh:
              now_kst = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9)))
              target = now_kst.replace(hour=int(hh), minute=0, second=0, microsecond=0)
              for run in data.get('workflow_runs', []):
                  if run['id'] == cur:
                      continue
                  dt = datetime.datetime.fromisoformat(run['created_at'].replace('Z', '+00:00'))
                  kst = dt.astimezone(datetime.timezone(datetime.timedelta(hours=9)))
                  if abs((kst - target).total_seconds()) <= 40 * 60:
                      found = True
                      break
          print('true' if found else 'false')
          ")
          echo "already=$ALREADY" >> "$GITHUB_OUTPUT"
          if [ "$ALREADY" = "true" ]; then
            echo "::notice::이 슬롯(${HH}:00)을 이미 성공시킨 실행이 있어(n8n 등) 이 안전망 cron 실행은 건너뜁니다"
          fi

      - uses: actions/setup-python@v5
        if: steps.dedup.outputs.already != 'true'
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Deno (yt-dlp JS 챌린지 솔버용)
        if: steps.dedup.outputs.already != 'true'
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        if: steps.dedup.outputs.already != 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt

      - name: Determine slot
        id: slot
        if: steps.dedup.outputs.already != 'true'
        run: |
          if [ -n "${{ github.event.inputs.slot }}" ]; then
            HH="${{ github.event.inputs.slot }}"
            HH="${HH%%:*}"
          else
            case "${{ github.event.schedule }}" in
              "9 13 * * 1-5") HH="22" ;;
              "9 14 * * 1-5") HH="23" ;;
              "9 15 * * 1-5") HH="00" ;;
              "9 16 * * 1-5") HH="01" ;;
              "9 17 * * 1-5") HH="02" ;;
              "9 18 * * 1-5") HH="03" ;;
              "9 19 * * 1-5") HH="04" ;;
              "9 20 * * 1-5") HH="05" ;;
              *) HH="$(TZ=Asia/Seoul date +%H)" ;;   # 수동 dispatch(슬롯 미입력) 등 폴백
            esac
          fi
          echo "hh=${HH}" >> "$GITHUB_OUTPUT"
          echo "hhmm=${HH}:00" >> "$GITHUB_OUTPUT"

      - name: Run pipeline (night slot)
        if: steps.dedup.outputs.already != 'true'
        env:
          PYTHONPATH: src
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          VOD="${{ github.event.inputs.vod_url }}"
          TRIM_START="${{ github.event.inputs.trim_start }}"
          TRIM_DURATION="${{ github.event.inputs.trim_duration }}"
          FLAGS="--session night --slot ${{ steps.slot.outputs.hhmm }} --skip-notify"
          if [ -n "$VOD" ]; then
            FLAGS="$FLAGS --vod-url $VOD"
            if [ -n "$TRIM_START" ]; then
              FLAGS="$FLAGS --trim-start $TRIM_START --trim-duration $TRIM_DURATION"
            fi
          fi
          if [ "${{ github.event.inputs.archive }}" != "true" ] && [ -n "$VOD" ]; then
            FLAGS="$FLAGS --skip-archive"
          fi
          python -m threetv.main $FLAGS

      - name: Upload analysis artifacts (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # hhmm("22:00")엔 콜론이 있어 아티팩트 업로드가 거부된다(2026-07-28
          # 확인, 파일이 있을 때만 발현되는 잠복 버그) — 콜론 없는 hh(시)를 쓴다.
          name: night-slot-${{ steps.slot.outputs.hh }}-${{ github.run_id }}
          path: |
            output/**/vision_results.json
          if-no-files-found: ignore
          retention-days: 3
