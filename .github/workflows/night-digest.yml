# 야간 미장 06시 종합: night-slot.yml이 저장한 8개 슬롯을 모아 리포트 1건 발행.
# cron은 KST 06:00 = UTC 21:00 월~금 (night-slot과 같은 요일 규칙, night-slot.yml
# 상단 주석 참고). 슬롯 job과 독립적으로 실행되며, 슬롯이 일부만 있어도 있는
# 만큼으로 리포트를 만든다(옵시디안 볼트에서 read_night_slots()로 조회).
name: night-digest

on:
  schedule:
    - cron: "0 21 * * 1-5"    # KST 06:00
  workflow_dispatch:
    inputs:
      notify:
        description: "false면 텔레그램/카카오 전송 생략 (기본 전송)"
        required: false
        default: "true"
      archive:
        description: "false면 볼트 저장 생략 (기본 저장)"
        required: false
        default: "true"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15      # 캡처·비전 없이 슬롯 텍스트 종합만 — 짧다
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline (night digest)
        env:
          PYTHONPATH: src
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          FLAGS="--session night --digest"
          if [ "${{ github.event.inputs.notify }}" = "false" ]; then
            FLAGS="$FLAGS --skip-notify"
          fi
          if [ "${{ github.event.inputs.archive }}" = "false" ]; then
            FLAGS="$FLAGS --skip-archive"
          fi
          python -m threetv.main $FLAGS

      - name: Print report (debug)
        if: always()
        run: |
          for f in $(find output -name report.md 2>/dev/null); do
            echo "===== $f ====="
            head -c 6000 "$f"
            echo
          done

      - name: Upload analysis artifacts (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: night-digest-${{ github.run_id }}
          path: |
            output/**/report.json
            output/**/report.md
          if-no-files-found: ignore
          retention-days: 7
