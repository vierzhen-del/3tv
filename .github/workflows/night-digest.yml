# 야간 미장 06시 종합: night-slot.yml이 저장한 8개 슬롯을 모아 리포트 1건 발행.
# cron은 KST 06:00 = UTC 21:00 월~금 (night-slot과 같은 요일 규칙, night-slot.yml
# 상단 주석 참고). 슬롯 job과 독립적으로 실행되며, 슬롯이 일부만 있어도 있는
# 만큼으로 리포트를 만든다(옵시디안 볼트에서 read_night_slots()로 조회).
name: night-digest

on:
  schedule:
    - cron: "17 21 * * 1-5"    # KST 06:17 (정각 혼잡 회피 — 2026-08-27 실측: 정각 cron이 통째로 드롭됨)
  workflow_dispatch:
    inputs:
      notify:
        description: "false면 텔레그램/카카오 전송 생략 (기본 전송)"
        required: false
        default: "true"
      archive:
        description: "false면 볼트 저장 생략 (기본 저장)"
        required: false
        default: "true"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15      # 캡처·비전 없이 슬롯 텍스트 종합만 — 짧다
    steps:
      - uses: actions/checkout@v4

      # n8n이 workflow_dispatch로 이미 오늘 성공시켰으면 이 안전망 cron 실행은
      # 건너뛴다 — schedule과 n8n이 겹쳐 돌면 텔레그램 중복 발송이 생긴다
      # (2026-08-27 실측: us 리포트 2회 중복 발송). workflow_dispatch(수동/n8n)는
      # 절대 건너뛰지 않는다 — 복구·테스트 실행이 막히면 안 됨.
      - name: 안전망 cron 중복 실행 방지
        id: dedup
        if: github.event_name == 'schedule'
        run: |
          curl -sS -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/night-digest.yml/runs?status=success&per_page=10" \
            -o /tmp/runs.json
          ALREADY=$(python3 -c "
          import json, datetime
          data = json.load(open('/tmp/runs.json'))
          today = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9))).strftime('%Y-%m-%d')
          cur = $GITHUB_RUN_ID
          found = False
          for run in data.get('workflow_runs', []):
              if run['id'] == cur:
                  continue
              dt = datetime.datetime.fromisoformat(run['created_at'].replace('Z', '+00:00'))
              kst = dt.astimezone(datetime.timezone(datetime.timedelta(hours=9)))
              if kst.strftime('%Y-%m-%d') == today:
                  found = True
                  break
          print('true' if found else 'false')
          ")
          echo "already=$ALREADY" >> "$GITHUB_OUTPUT"
          if [ "$ALREADY" = "true" ]; then
            echo "::notice::오늘 이미 성공한 실행이 있어(n8n 등) 이 안전망 cron 실행은 건너뜁니다"
          fi

      - uses: actions/setup-python@v5
        if: steps.dedup.outputs.already != 'true'
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        if: steps.dedup.outputs.already != 'true'
        run: pip install -r requirements.txt

      - name: Run pipeline (night digest)
        if: steps.dedup.outputs.already != 'true'
        env:
          PYTHONPATH: src
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          FLAGS="--session night --digest"
          if [ "${{ github.event.inputs.notify }}" = "false" ]; then
            FLAGS="$FLAGS --skip-notify"
          fi
          if [ "${{ github.event.inputs.archive }}" = "false" ]; then
            FLAGS="$FLAGS --skip-archive"
          fi
          python -m threetv.main $FLAGS

      - name: Print report (debug)
        if: always()
        run: |
          for f in $(find output -name report.md 2>/dev/null); do
            echo "===== $f ====="
            head -c 6000 "$f"
            echo
          done

      - name: Upload analysis artifacts (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: night-digest-${{ github.run_id }}
          path: |
            output/**/report.json
            output/**/report.md
          if-no-files-found: ignore
          retention-days: 7
